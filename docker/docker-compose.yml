version: '3.8'

services:
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_LOCATION=file:///app/config/application.yaml
      - hapi.fhir.default_encoding=json
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_multiple_delete=true
      - hapi.fhir.reuse_cached_search_results_millis=5000
      - spring.datasource.url=jdbc:postgresql://postgres:5432/hapi
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi123
      - spring.datasource.driverClassName=org.postgresql.Driver
      - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      - spring.jpa.hibernate.ddl-auto=update
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - hapi-data:/app/data
    networks:
      - fhir-network

  postgres:
    image: postgres:15
    container_name: hapi-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=hapi
      - POSTGRES_PASSWORD=hapi123
      - POSTGRES_DB=hapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fhir-network

volumes:
  hapi-data:
  postgres-data:

networks:
  fhir-network:
    driver: bridge
